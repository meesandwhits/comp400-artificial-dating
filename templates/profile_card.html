<!-- The phone profile card. Expects a variable called `profile` (a dict, see PROFILES in app.py). -->
<div class="tinder_profile_card" style="text-align: left;">
    <div class="profile-scroll">
        <div class="photo-stack">
            {% for photo in profile.photos %}
            <img class="photo{% if loop.first %} active{% endif %}" src="{{ url_for('static', filename='images/' ~ photo) }}" alt="Photo {{ loop.index }}">
            {% endfor %}

            <div class="photo-bars"></div>
            <button class="photo-prev" type="button" aria-label="Previous photo"></button>
            <button class="photo-next" type="button" aria-label="Next photo"></button>
        </div>
        <button class="scroll-down-btn" type="button" aria-label="Scroll down">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="white">
                <path d="M10.5 4h3v8H17l-5 6-5-6h3.5z"/>
            </svg>
        </button>

        <p style="margin-top: 25px; margin-left: 15px; margin-bottom: 0px; font-size: 28px"><span style="font-family: 'Gotham Rounded Bold', sans-serif;">{{ profile.name }}</span> {{ profile.age }}</p>
        <ul class="profile-details">
            <li>
                <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.5 18c1.2-2.2 3-3.2 5.5-3.2s4.3 1 5.5 3.2"/></svg>
                {{ profile.pronouns }}</li>
            <li>
                <svg viewBox="0 0 24 24"><path d="M2.5 17 17 2.5 21.5 7 7 21.5z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg>
                {{ profile.height }}</li>
            <li>
                <svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M3 13h18"/></svg>
                {{ profile.job }}</li>
            <li>
                <svg viewBox="0 0 24 24"><path d="M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11z"/><circle cx="12" cy="10" r="2.3"/></svg>
                {{ profile.distance }}</li>
        </ul>

        <div class="looking-for-card">
            <span>😍</span>
            <div>
                <p>Looking for</p>
                <strong>{{ profile.looking_for }}</strong>
            </div>
        </div>

        <p style="margin: 20px 0 15px 20px; font-family: 'Gotham Rounded Bold', sans-serif; font-size: 20px">About me</p>
        <p style="margin: 0px 20px 40px 20px; font-family: 'Gotham Rounded Book', sans-serif; font-size: 15px">"{{ profile.bio }}"</p>
    </div>
</div>
